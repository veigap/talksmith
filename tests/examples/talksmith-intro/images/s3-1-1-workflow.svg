<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 974 356" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Eight steps, driven from chat</title>
<desc>The shape of the workflow: setup comes first (the audience profile, set once per subject; then, for each talk, its topic, its sources, and the corpus compiled from them); the middle is a loop (draft, review with inline feedback, repeat until right); after it, Polish produces final.md and rendering is optional.</desc>
