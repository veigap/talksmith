<line x1="875.0" y1="242" x2="875.0" y2="290"/>
</g>
<g text-anchor="middle" font-weight="700">
<rect x="24" y="50" width="150" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/><text x="99.0" y="77">0</text><text x="99.0" y="100" font-size="19" fill="#1F1E1E">Introduce</text>
<rect x="218" y="50" width="150" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/><text x="293.0" y="77">0.5</text><text x="293.0" y="100" font-size="19" fill="#1F1E1E">Profile</text>
<rect x="412" y="50" width="150" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/><text x="487.0" y="77">1</text><text x="487.0" y="100" font-size="19" fill="#1F1E1E">Frame</text>
<rect x="606" y="50" width="150" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/><text x="681.0" y="77">2</text><text x="681.0" y="100" font-size="19" fill="#1F1E1E">Collect</text>
<rect x="800" y="50" width="150" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/><text x="875.0" y="77">3</text><text x="875.0" y="100" font-size="19" fill="#1F1E1E">Corpus</text>
