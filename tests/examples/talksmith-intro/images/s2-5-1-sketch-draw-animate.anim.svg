<svg class="ts-anim-s2-5-1-sketch-draw-animate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 266" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="14">
<title>Your diagrams draw themselves</title>
<desc>How the mechanism works: diagrams live in draft.md as fenced ASCII blocks — proposed by the agent, editable by you like any text — so you never spend time making a diagram look nicer.</desc>
