<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 519" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3B3535">
<title>Review is a loop</title>
<desc>How feedback actually flows, in three moves: leave feedback, Talksmith applies, review and repeat.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="770" height="519" fill="#ffffff"/>
<g transform="translate(-15,5)">
<g fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)">
<path d="M280 64 V96"/>
<path d="M280 140 V196"/>
<path d="M470 218 H560"/>
<path d="M660 240 V300 H472"/>
<path d="M280 344 V380"/>
<path d="M280 424 V460 H40 V42 H160"/>
</g>
<g stroke="#D8D2CE" stroke-width="1.5" fill="#F2EEEE">
<rect x="160" y="20" width="240" height="44" rx="8"/>
<rect x="90" y="96" width="380" height="44" rx="8" fill="#F2F2F2"/>
<rect x="90" y="196" width="380" height="44" rx="8" fill="#F2F2F2"/>
<rect x="560" y="196" width="200" height="44" rx="8"/>
<rect x="90" y="380" width="380" height="44" rx="8"/>
</g>
<rect x="90" y="276" width="380" height="68" rx="8" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.5"/>
<g text-anchor="middle" font-weight="bold" fill="#1F1E1E">
<text x="280" y="48">you edit draft.md</text>
<text x="660" y="224">apply the change</text>
<text x="280" y="408">mirrored to feedback-backlog.md</text>
</g>
<g font-family="'Andale Mono', monospace" font-size="15">
<text x="280" y="123" text-anchor="middle">- "trim this slide"</text>
<text x="280" y="223" text-anchor="middle">[open] 2026-07-14 — "..."</text>
<text x="110" y="305"><tspan fill="#DA1B2E" font-weight="bold">[closed]</tspan> 2026-07-14 — "..."</text>
<text x="110" y="331" xml:space="preserve">  <tspan fill="#DA1B2E" font-weight="bold">Resolution:</tspan> what changed &amp; why</text>
</g>
<g font-size="15" font-style="italic" fill="#6B6363">
<text x="486" y="123">(raw bullet)</text>
<text x="292" y="173">editor stamps + dates</text>
<text x="486" y="330">(stays in draft.md — never deleted)</text>
</g>
<text x="56" y="486" font-size="16" font-weight="bold" fill="#1F1E1E">next round, until you say “final”</text>
</g>
</svg>
