<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 760" width="1750" height="760" font-family="Helvetica, Arial, sans-serif" fill="#1F1E1E">
<title>StyleGAN: red de mapeo y red de síntesis</title>
<desc>El ruido z pasa por la red de mapeo (8 capas) y se convierte en el estilo w. La red de síntesis arma la imagen en bloques que crecen de 4×4 a 1024×1024; el estilo w entra en cada bloque por AdaIN y cada bloque recibe además su propio ruido. Los bloques de baja resolución deciden la pose y la forma; los de alta resolución, la textura y el color.</desc>
<defs>
<marker id="a1F1E1E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F1E1E"/></marker>
<marker id="aDA1B2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
<marker id="a2E8540" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8540"/></marker>
<marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
</defs>
<rect width="1750" height="760" fill="#ffffff"/>
<text x="300" y="46" font-size="30" fill="#6B6560" text-anchor="middle" font-weight="bold" letter-spacing="2">1 · RED DE MAPEO</text>
<text x="1060" y="46" font-size="30" fill="#6B6560" text-anchor="middle" font-weight="bold" letter-spacing="2">2 · RED DE SÍNTESIS</text>
<line x1="30" y1="66" x2="1720" y2="66" stroke="#D9D4CF" stroke-width="3"/>
<g>
<rect x="30" y="130" width="150" height="90" rx="12" fill="#ffffff" stroke="#1F1E1E" stroke-width="3"/>
<text x="105" y="172" font-size="30" fill="#1F1E1E" text-anchor="middle" font-weight="bold">ruido z</text>
<text x="105" y="206" font-size="22" fill="#6B6560" text-anchor="middle">512 números</text>
<path d="M180,175 H206" stroke="#1F1E1E" stroke-width="3" fill="none" marker-end="url(#a1F1E1E)"/>
<rect x="214" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="236" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="258" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="280" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="302" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="324" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="346" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<rect x="368" y="122" width="16" height="106" rx="3" fill="#1F1E1E"/>
<text x="300" y="262" font-size="26" fill="#6B6560" text-anchor="middle">8 capas</text>
</g>
<g>
<path d="M394,175 H420" stroke="#1F1E1E" stroke-width="3" fill="none" marker-end="url(#a1F1E1E)"/>
<rect x="428" y="130" width="150" height="90" rx="12" fill="#DA1B2E"/>
<text x="503" y="172" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">estilo w</text>
<text x="503" y="206" font-size="22" fill="#ffffff" text-anchor="middle">512 números</text>
</g>
<g>
<path d="M578,175 H1480" stroke="#DA1B2E" stroke-width="4" fill="none"/>
<text x="1000" y="159" font-size="27" fill="#DA1B2E" text-anchor="middle" font-weight="bold">el estilo w entra en cada bloque (AdaIN)</text>
<path d="M700,175 V340" stroke="#DA1B2E" stroke-width="3" fill="none" marker-end="url(#aDA1B2E)"/>
</g>
<g>
<rect x="653.0" y="346" width="94" height="174" rx="10" fill="#F2EEEE" stroke="#1F1E1E" stroke-width="2.5"/>
<rect x="673.0" y="446" width="54" height="54" fill="#ffffff" stroke="#1F1E1E" stroke-width="2"/>
<text x="700" y="378" font-size="26" fill="#1F1E1E" text-anchor="middle" font-weight="bold">4×4</text>
</g>
<g>
