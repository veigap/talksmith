<rect x="823.0" y="426" width="74" height="74" fill="#ffffff" stroke="#1F1E1E" stroke-width="2"/>
<text x="860" y="358" font-size="26" fill="#1F1E1E" text-anchor="middle" font-weight="bold">8×8</text>
</g>
<g>
<path d="M860,590 V526" stroke="#2E8540" stroke-width="3" fill="none" marker-end="url(#a2E8540)"/>
<path d="M1040,175 V298" stroke="#DA1B2E" stroke-width="3" fill="none" marker-end="url(#aDA1B2E)"/>
</g>
<g>
<rect x="972.0" y="304" width="136" height="216" rx="10" fill="#F2EEEE" stroke="#1F1E1E" stroke-width="2.5"/>
<rect x="992.0" y="404" width="96" height="96" fill="#ffffff" stroke="#1F1E1E" stroke-width="2"/>
<text x="1040" y="336" font-size="26" fill="#1F1E1E" text-anchor="middle" font-weight="bold">16×16</text>
</g>
<g>
<path d="M1040,590 V526" stroke="#2E8540" stroke-width="3" fill="none" marker-end="url(#a2E8540)"/>
</g>
<g>
<text x="1250" y="470" font-size="44" fill="#6B6560" text-anchor="middle" font-weight="bold">…</text>
</g>
<g>
<path d="M1480,175 V244" stroke="#DA1B2E" stroke-width="3" fill="none" marker-end="url(#aDA1B2E)"/>
</g>
<g>
<rect x="1385.0" y="250" width="190" height="270" rx="10" fill="#F2EEEE" stroke="#1F1E1E" stroke-width="2.5"/>
<rect x="1405.0" y="350" width="150" height="150" fill="#ffffff" stroke="#1F1E1E" stroke-width="2"/>
<text x="1480" y="282" font-size="26" fill="#1F1E1E" text-anchor="middle" font-weight="bold">1024×1024</text>
</g>
<g>
<path d="M1480,590 V526" stroke="#2E8540" stroke-width="3" fill="none" marker-end="url(#a2E8540)"/>
</g>
<g>
<path d="M747.0,480 H799.0" stroke="#1F1E1E" stroke-width="3" fill="none" marker-end="url(#a1F1E1E)"/>
<path d="M917.0,480 H968.0" stroke="#1F1E1E" stroke-width="3" fill="none" marker-end="url(#a1F1E1E)"/>
<path d="M1108.0,480 H1220" stroke="#1F1E1E" stroke-width="3" fill="none" marker-end="url(#a1F1E1E)"/>
<path d="M1276,480 H1381.0" stroke="#1F1E1E" stroke-width="3" fill="none" marker-end="url(#a1F1E1E)"/>
</g>
<g>
<text x="1090" y="620" font-size="26" fill="#2E8540" text-anchor="middle" font-style="italic">ruido por bloque: detalles finos (pelo, poros, pecas)</text>
<path d="M1480,526" />
</g>
<g>
<path d="M650,656 V666 H1110 V656" stroke="#6B6560" stroke-width="3" fill="none"/>
<text x="880.0" y="698" font-size="28" fill="#1F1E1E" text-anchor="middle" font-weight="bold">capas bajas: pose y forma de la cara</text>
<path d="M1385,656 V666 H1575 V656" stroke="#6B6560" stroke-width="3" fill="none"/>
<text x="1480.0" y="698" font-size="28" fill="#1F1E1E" text-anchor="middle" font-weight="bold">capas altas: textura y color</text>
<text x="1480" y="433.0" font-size="26" fill="#6B6560" text-anchor="middle" font-style="italic">la cara final</text>
</g>
</svg>
