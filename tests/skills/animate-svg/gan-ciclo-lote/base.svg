<title>Un lote de entrenamiento: un error por imagen, un promedio, un paso de backpropagation por red</title>
<desc>Paso del Discriminador: un lote de 3 imágenes reales (objetivo 1) y 3 generadas (objetivo 0); el Discriminador da un veredicto por imagen, cada imagen tiene su error (0.11, 0.22, 0.36, 1.14, 0.51, 0.80), el promedio del lote es 0.52 y con ese número se hace backpropagation, que actualiza solo el Discriminador. Paso del Generador: solo las 3 generadas, ahora con objetivo 1; errores 0.39, 0.92, 0.60; promedio 0.63; backpropagation; actualiza solo el Generador. Después, el siguiente lote.</desc>
