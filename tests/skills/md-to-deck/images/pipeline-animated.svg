<svg class="ts-anim-pipeline-animated" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <title>Pipeline, step by step</title>
  <desc>Tokenize, predict, generate — each step arriving in turn.</desc>
<style>/* talksmith-animation */
.ts-anim-pipeline-animated [data-beat]{animation:ts-beat-in 0.6s ease-out backwards}
.ts-anim-pipeline-animated [data-beat-effect=pulse]{animation-name:ts-beat-pulse;animation-duration:0.8s;animation-fill-mode:none;transform-box:fill-box;transform-origin:center}
.ts-anim-pipeline-animated [data-beat="1"]{animation-delay:0.50s}
.ts-anim-pipeline-animated [data-beat="2"]{animation-delay:1.60s}
.ts-anim-pipeline-animated [data-beat="3"]{animation-delay:2.70s}
@keyframes ts-beat-in{from{opacity:0}to{opacity:1}}
@keyframes ts-beat-pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ts-anim-pipeline-animated [data-beat]{animation:none}}
</style>
  <rect width="640" height="360" fill="#FFFFFF"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
    <path d="M0 0 L6 3 L0 6 z" fill="#DA1B2E"/></marker></defs>
  <g font-family="Helvetica,Arial" font-size="18" font-weight="700" text-anchor="middle">
    <g data-beat="1">
      <rect x="40" y="150" width="140" height="60" rx="10" stroke="#DA1B2E" stroke-width="3"/>
      <text x="110" y="185" fill="#1F1E1E">Tokeniza</text>
    </g>
    <g data-beat="2">
      <path d="M180 180 H250" stroke="#DA1B2E" stroke-width="3" marker-end="url(#a)"/>
      <rect x="250" y="150" width="140" height="60" rx="10" stroke="#DA1B2E" stroke-width="3"/>
      <text x="320" y="185" fill="#1F1E1E">Predice</text>
    </g>
    <g data-beat="3">
      <path d="M390 180 H460" stroke="#DA1B2E" stroke-width="3" marker-end="url(#a)"/>
      <rect x="460" y="150" width="140" height="60" rx="10" stroke="#DA1B2E" stroke-width="3"/>
      <text x="530" y="185" fill="#1F1E1E">Genera</text>
    </g>
  </g>
</svg>
