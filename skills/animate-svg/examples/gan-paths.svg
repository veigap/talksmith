<svg class="ts-anim-gan-paths" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Arquitectura de una Vanilla GAN</title>
<desc>Redibujo vectorial del diagrama del slide 15 del pptx original (AIG4B Clase 8), con las mismas piezas: el ruido z entra al Generador (G), que produce una muestra falsa; los datos reales aportan una muestra real; el Discriminador (D) recibe ambas y decide si es real o falsa; esa decisión da la pérdida de G y la pérdida de D, que vuelven para actualizar cada red. La salida del D es un veredicto, la probabilidad de que la imagen sea real; no es una bifurcación: la pérdida de G usa los veredictos sobre las generadas y la de D los veredictos sobre reales y generadas.</desc>
