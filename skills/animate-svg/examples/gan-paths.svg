.ts-anim-gan-paths [data-beat="1"]{animation-delay:0.5s}
.ts-anim-gan-paths [data-beat="2"]{animation-delay:1.6s}
.ts-anim-gan-paths [data-beat="3"]{animation-delay:2.7s}
.ts-anim-gan-paths [data-beat="4"]{animation-delay:3.8s}
.ts-anim-gan-paths [data-beat="5"]{animation-delay:4.9s}
.ts-anim-gan-paths [data-beat="6"]{animation-delay:6.0s}
.ts-anim-gan-paths .path1{animation:ts-anim-gan-paths-show 6s linear 7.2s both}
.ts-anim-gan-paths .path1 .ball{animation:ts-anim-gan-paths-path1 6s linear 7.2s 1 normal both}
