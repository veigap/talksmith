.ts-anim-gan-paths .path2 .ball{animation:ts-anim-gan-paths-path2 6s linear 13.8s 1 normal both}
.ts-anim-gan-paths .path3{animation:ts-anim-gan-paths-show 6s linear 20.4s both}
.ts-anim-gan-paths .path3 .ball{animation:ts-anim-gan-paths-path3 6s linear 20.4s 1 normal both}
